  - question: "Welche Formel berechnet den Grundwert?"
    options: ["G = W × 100 / p", "G = W × p / 100", "G = W + p", "G = W − p"]
    correctIndex: 0
    explanation: "Der Grundwert ergibt sich aus Prozentwert mal 100 geteilt durch Prozentsatz."
  - question: "50 € sind 25 %. Wie hoch ist der Grundwert?"
    options: ["100 €", "150 €", "200 €", "250 €"]
    correctIndex: 2
    explanation: "50 € × 100 / 25 = 200 €."
  - question: "90 kg sind 45 %. Wie hoch ist der Grundwert?"
    options: ["150 kg", "180 kg", "200 kg", "225 kg"]
    correctIndex: 2
