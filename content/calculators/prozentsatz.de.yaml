h1: "Prozentsatz berechnen"
intro: "Der Prozentsatz-Rechner ermittelt, wie viel Prozent ein Wert vom Grundwert ausmacht. Gib den Prozentwert und den Grundwert ein — das Ergebnis erscheint sofort."
formulaGeneral: "p\\% = W \\times \\frac{100}{G}"
educationTitle: "Was ist der Prozentsatz?"
educationText: |
  Der Prozentsatz (p%) gibt an, welcher Anteil ein Prozentwert (W) vom Grundwert (G) ausmacht. Er wird in „Prozent“ angegeben, also in Hundertsteln des Grundwerts.

  Die klassische Aufgabenstellung lautet: „100 € sind wie viel Prozent von 500 €?“ Hier ist 100 € der Prozentwert (W), 500 € der Grundwert (G) und das gesuchte Ergebnis 20 % der Prozentsatz (p).

  Die Formel lautet: p% = W × 100 / G. Du teilst also den Prozentwert durch den Grundwert und multiplizierst das Ergebnis mit 100.

  Typische Anwendungen sind Rabattangaben, Gewinnmargen, prozentuale Anteile oder Noten. Ein häufiger Fehler ist es, W / G zu berechnen und das Ergebnis als Prozentangabe zu lesen — vergiss nicht, mit 100 zu multiplizieren, damit aus 0,2 wieder 20 % wird.

tip: "Kürze vor dem Rechnen, wenn möglich: 100 / 500 = 1 / 5, also ist der Prozentsatz 20 %."
faq:
  - question: "Was ist der Unterschied zwischen Prozentsatz und Prozentwert?"
    answer: "Der Prozentsatz gibt den Anteil in Hundertsteln an (z. B. 20 %). Der Prozentwert ist der dazugehörige absolute Betrag (z. B. 100 €)."
  - question: "Wie viel Prozent sind 100 € von 500 €?"
    answer: "100 € × 100 / 500 € = 20 %. Der Prozentsatz beträgt also 20 %."
  - question: "Kann der Prozentsatz größer als 100 % sein?"
    answer: "Ja, sobald der Prozentwert größer als der Grundwert ist. 600 € von 500 € sind beispielsweise 120 %."
  - question: "Was ist der Grundwert in der Prozentrechnung?"
    answer: "Der Grundwert ist die Ausgangszahl, auf die sich der Prozentsatz bezieht. In „100 € von 500 €“ sind 500 € der Grundwert."
  - question: "Wie rechnet man Prozentsätze in Dezimalzahlen um?"
    answer: "Teile den Prozentsatz durch 100. 20 % entspricht 0,2, 150 % entspricht 1,5."
  - question: "Warum muss ich mit 100 multiplizieren?"
    answer: "Prozent bedeutet „pro Hundert“. Der Quotient W / G ist ein Dezimalwert; mit 100 wird daraus die Prozentangabe."
quiz:
  - question: "Wie viel Prozent sind 50 € von 200 €?"
    options: ["10 %", "20 %", "25 %", "50 %"]
    correctIndex: 2
    explanation: "50 € × 100 / 200 € = 25 %."
  - question: "Welche Formel berechnet den Prozentsatz?"
    options: ["p% = W × 100 / G", "p% = G × 100 / W", "p% = W + G", "p% = W − G"]
    correctIndex: 0
    explanation: "Der Prozentsatz ergibt sich aus Prozentwert mal 100 geteilt durch Grundwert."
  - question: "120 € sind wie viel Prozent von 80 €?"
    options: ["66,7 %", "100 %", "120 %", "150 %"]
    correctIndex: 3
    explanation: "120 € × 100 / 80 € = 150 %."
  - question: "25 kg sind wie viel Prozent von 100 kg?"
    options: ["2,5 %", "20 %", "25 %", "250 %"]
    correctIndex: 2
    explanation: "25 kg × 100 / 100 kg = 25 %."
