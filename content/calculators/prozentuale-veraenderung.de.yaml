mode: prozentuale-veraenderung
metaTitle: "Prozentuale Veränderung berechnen — Kostenloser Online-Rechner"
metaDescription: "Berechne prozentuale Zu- und Abnahmen mit der Formel p% = (W₂ − W₁) / W₁ × 100. Mit Rechenweg."
h1: "Prozentuale Veränderung berechnen"
intro: "Der Rechner für prozentuale Veränderung ermittelt, um wie viel Prozent ein Wert gestiegen oder gefallen ist. Gib den alten und den neuen Wert ein — das Ergebnis erscheint sofort."
formulaGeneral: "p\\% = \\frac{W_2 - W_1}{W_1} \\times 100"
educationTitle: "Was ist eine prozentuale Veränderung?"
educationText: |
  Eine prozentuale Veränderung gibt an, um wie viel Prozent ein Wert im Vergleich zu einem früheren Wert gestiegen oder gesunken ist. Positive Ergebnisse bedeuten Zunahme, negative Ergebnisse bedeuten Abnahme.

  Die klassische Aufgabenstellung lautet: „Ein Preis steigt von 80 € auf 100 €. Um wie viel Prozent hat er sich erhöht?“ Hier ist 80 € der alte Wert (W₁), 100 € der neue Wert (W₂) und das Ergebnis 25 %.

  Die Formel lautet: p% = (W₂ − W₁) / W₁ × 100. Du bildest also die Differenz der beiden Werte, teilst sie durch den alten Wert und multiplizierst mit 100.

  Typische Anwendungen sind Preisveränderungen, Gehaltsveränderungen, Aktienkursgewinne oder Umsatzentwicklungen. Ein häufiger Fehler ist es, die Differenz durch den neuen Wert zu teilen — der Bezugspunkt ist aber immer der alte Wert.

tip: "Merke dir: Steigerung ist positiv, Senkung ist negativ. Ein Wert von −20 % bedeutet eine Abnahme um ein Fünftel."
faq:
  - question: "Was bedeutet eine prozentuale Veränderung von 0 %?"
    answer: "Der neue Wert ist gleich dem alten Wert. Es hat sich nichts verändert."
  - question: "Ein Preis steigt von 80 € auf 100 €. Um wie viel Prozent steigt er?"
    answer: "(100 € − 80 €) / 80 € × 100 = 25 %. Der Preis ist um 25 % gestiegen."
  - question: "Ein Wert fällt von 100 auf 80. Um wie viel Prozent sinkt er?"
    answer: "(80 − 100) / 100 × 100 = −20 %. Der Wert ist um 20 % gesunken."
  - question: "Warum wird durch den alten Wert geteilt?"
    answer: "Die prozentuale Veränderung bezieht sich immer auf den Ausgangswert, also den Wert vor der Veränderung."
  - question: "Kann die prozentuale Veränderung kleiner als −100 % sein?"
    answer: "Ja, wenn der neue Wert negativ ist oder der alte Wert bereits negativ war. Bei positiven Ausgangswerten bedeutet −100 % einen vollständigen Verlust."
  - question: "Was ist der Unterschied zur Ab-/Zunahme-Rechnung?"
    answer: "Die prozentuale Veränderung berechnet nur die prozentuale Änderung. Die Ab-/Zunahme-Rechnung berechnet direkt den neuen Endwert."
quiz:
  - question: "Ein Wert steigt von 50 auf 75. Wie hoch ist die prozentuale Veränderung?"
    options: ["25 %", "33,3 %", "50 %", "75 %"]
    correctIndex: 2
    explanation: "(75 − 50) / 50 × 100 = 50 %."
  - question: "Welche Formel berechnet die prozentuale Veränderung?"
    options: ["p% = (W₂ − W₁) / W₁ × 100", "p% = (W₂ − W₁) / W₂ × 100", "p% = W₂ / W₁", "p% = W₂ − W₁"]
    correctIndex: 0
    explanation: "Die Differenz wird durch den alten Wert geteilt und mit 100 multipliziert."
  - question: "Ein Aktienkurs fällt von 200 € auf 160 €. Wie hoch ist die Veränderung?"
    options: ["−20 %", "−25 %", "−40 %", "−80 %"]
    correctIndex: 0
    explanation: "(160 − 200) / 200 × 100 = −20 %."
  - question: "Von 120 auf 150 entspricht einer Steigerung um:"
    options: ["20 %", "25 %", "30 %", "50 %"]
    correctIndex: 1
    explanation: "(150 − 120) / 120 × 100 = 25 %."
